# Perguntas de avaliação da Clara (Secretária). `tools` são as ferramentas
# que uma boa resposta deveria usar; o rake virtual_clinic:eval mostra as
# que ela usou de fato, para conferir à mão.
- question: Quem você está atendendo agora?
  tools: [atendimento_agora, buscar_conversas]
- question: Quem você está fazendo follow-up agora?
  tools: [follow_ups_em_andamento]
- question: E quem vai receber follow-up hoje?
  tools: [follow_ups_em_andamento, mensagens_agendadas]
- question: Quem está esperando resposta há mais tempo?
  tools: [buscar_conversas]
- question: Quantos pacientes você atendeu hoje?
  tools: [buscar_conversas]
- question: Quem você passou para um humano hoje, e por quê?
  tools: [transferencias_ia_humano, resumir_conversa]
- question: Quais mensagens estão programadas para hoje?
  tools: [mensagens_agendadas]
- question: Alguém pediu para remarcar consulta hoje?
  tools: [buscar_conversas, resumir_conversa]
- question: Tem algum paciente sem resposta há mais de meia hora?
  tools: [buscar_conversas]
- question: Quantos follow-ups você mandou hoje e quantos responderam?
  tools: [follow_ups]
- question: Como foi a conversão do mês?
  tools: []
  note: Pergunta de gestão; a Clara deve encaminhar para a Helena.
- question: Qual o telefone do último paciente que você atendeu?
  tools: [buscar_conversas, buscar_contato]
  note: Só aqui o telefone pode aparecer, porque foi pedido.
- question: Qual campanha trouxe mais leads este mês?
  tools: []
  note: Marketing; deve responder que isso é com o Luciano, sem número.
