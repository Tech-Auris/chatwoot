- tag: v4.15.1-auris.1.81
  published_at: '2026-11-18T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.81
  notes:
    en: |-
      ### 🐛 Fixes

      - **A warning when the official WhatsApp gets disconnected.** If the clinic's official WhatsApp number loses its connection to AurisChat (for example, after disconnecting WhatsApp Business on the phone), the sidebar now shows the alert to reconnect it. Before, messages stopped going out without any warning.
    pt_BR: |-
      ### 🐛 Correções

      - **Aviso quando o WhatsApp oficial é desconectado.** Se o número do WhatsApp oficial da clínica perder a conexão com o AurisChat (por exemplo, ao desconectar o WhatsApp Business no celular), a barra lateral agora mostra o alerta para reconectar. Antes, as mensagens deixavam de sair sem nenhum aviso.
- tag: v4.15.1-auris.1.80
  published_at: '2026-11-17T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.80
  notes:
    en: |-
      ### ✨ What's new

      - **See the patient's appointment on the Funnel card (beta).** The card shows the next appointment's date and time in green, with the professional and procedure. A "+1", "+2"… means the patient has more appointments booked.
      - **Every appointment of the patient in the conversation (beta).** In the right sidebar, open "Agendamentos" to see all of the patient's appointments, with status, professional and what was closed at the visit.
      - **Upcoming appointments in one place (beta).** In Relatórios → Agendamentos, see who's booked for today, tomorrow or the coming days, and filter by professional.

      Appointments are in beta and show up only for clinics whose scheduling system is already connected to AurisChat. Other scheduling systems are being added gradually.
    pt_BR: |-
      ### ✨ Novidades

      - **Veja o agendamento do paciente no card do Funil (beta).** O card mostra em verde a data e o horário do próximo agendamento, com o profissional e o procedimento. Um "+1", "+2"… indica que o paciente tem outros agendamentos marcados.
      - **Todos os agendamentos do paciente na conversa (beta).** Na lateral direita, abra "Agendamentos" para ver todos os agendamentos do paciente, com status, profissional e o que foi fechado no atendimento.
      - **Próximos agendamentos num lugar só (beta).** Em Relatórios → Agendamentos, veja quem está marcado para hoje, amanhã ou os próximos dias, e filtre por profissional.

      Os agendamentos estão em fase beta e aparecem só para clínicas cujo sistema de agenda já está integrado ao AurisChat. Os demais sistemas estão sendo liberados aos poucos.
- tag: v4.15.1-auris.1.79
  published_at: '2026-11-16T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.79
  notes:
    en: |-
      ### ⚡ Improvements

      - **Login lasts 7 days.** For security, AurisChat asks you to sign in again every 7 days, or after 12 hours without use. The screen goes back to login on its own with a notice.
      - **AI feedback box grows with your text.** When you give feedback on an AI reply, the box expands as you type and shows how many characters you have left (up to 5,000).

      ### 🐛 Fixes

      - **AI cards on Home load normally.** On clinics with many patients, "First response time", "Conversations the AI handled" and "AI → Human handoff" now show their numbers instead of an error.
      - **Emoji reactions don't count as waiting.** If the patient only reacts with an emoji (❤️, 👏…) to a reply, the conversation no longer shows up in "No reply for 10+ min".
    pt_BR: |-
      ### ⚡ Melhorias

      - **Login vale 7 dias.** Por segurança, o AurisChat pede para entrar de novo a cada 7 dias, ou depois de 12 horas sem uso. A tela volta sozinha para o login com um aviso.
      - **Caixa de feedback da IA cresce com o texto.** Ao dar feedback numa resposta da IA, a caixa aumenta conforme você escreve e mostra quantos caracteres faltam (até 5.000).

      ### 🐛 Correções

      - **Cards de IA do Início voltam a carregar.** Em clínicas com muitos pacientes, "Tempo de primeira resposta", "Conversas que a IA atuou" e "Handoff IA → Humano" agora mostram os números em vez de erro.
      - **Reação com emoji não conta como esperando.** Se o paciente só reage com um emoji (❤️, 👏…) a uma resposta, a conversa não aparece mais em "Sem resposta há +10 min".
- tag: v4.15.1-auris.1.78
  published_at: '2026-11-13T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.78
  notes:
    en: |-
      ### ⚡ Improvements

      - **The Funnel opens with only what's in progress.** Board and List now hide finished and resolved conversations when you open them. Untick "Hide resolved conversations" or "Hide finished" to see them again, and "Clear filters" brings the hiding back.
      - **Only your team in the agent lists.** When you assign a conversation or look at agent reports, you now see just your clinic's team and the AI assistant.
    pt_BR: |-
      ### ⚡ Melhorias

      - **O Funil abre só com o que está em andamento.** O Quadro e a Lista agora escondem as conversas finalizadas e resolvidas ao abrir. Desmarque "Ocultar conversas resolvidas" ou "Ocultar finalizadas" para vê-las de novo, e "Limpar filtros" volta a esconder.
      - **Só a sua equipe nas listas de atendentes.** Ao atribuir uma conversa ou olhar os relatórios de agentes, você agora vê apenas a equipe da clínica e a IA.
- tag: v4.15.1-auris.1.77
  published_at: '2026-11-11T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.77
  notes:
    en: |-
      ### ⚡ Improvements

      - **Home loads one block at a time.** When you change the period, source or inbox, each block shows a spinner and appears as soon as its numbers are ready. If one block fails, only that block shows "Tentar de novo" and the rest of Home keeps working.
      - **See who's handling each conversation on every tab.** The conversation card now shows the agent's avatar on the Mine tab too, not only on All.

      ### 🐛 Fixes

      - **Follow-up result shows up right away.** When the patient answers a follow-up, it's marked "Paciente respondeu" on the spot and the badge leaves the top of the conversation, even with the AI off. If you turn the AI off before the patient answers, it shows "Interrompido", and if you resolve the conversation, "Encerrado".
    pt_BR: |-
      ### ⚡ Melhorias

      - **O Início carrega um bloco de cada vez.** Ao trocar o período, a origem ou as caixas, cada bloco mostra um carregando e aparece assim que os números dele ficam prontos. Se um bloco falhar, só ele mostra "Tentar de novo" e o resto do Início continua funcionando.
      - **Veja quem está com cada conversa em todas as abas.** O card da conversa agora mostra a bolinha do atendente também na aba Minhas, e não só em Todos.

      ### 🐛 Correções

      - **Resultado do follow-up aparece na hora.** Quando o paciente responde a um follow-up, ele já fica como "Paciente respondeu" e o selo sai do topo da conversa, mesmo com a IA desligada. Se você desligar a IA antes de o paciente responder, fica "Interrompido", e se resolver a conversa, "Encerrado".
- tag: v4.15.1-auris.1.76
  published_at: '2026-11-10T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.76
  notes:
    en: |-
      ### ✨ What's new

      - **New Home page.** After you log in, AurisChat opens on Home: the day's summary and the clinic's numbers (leads, appointments, follow-up, no-shows, attendance and the AI's work) in one place. Click any number to see the conversations behind it.
      - **Turn the AI off for one contact.** On the contact's page or in the conversation's side panel, switch off "IA responde este contato" for people the AI shouldn't answer, like the clinic's own doctors or partners. Their messages keep arriving with the AI off, in any conversation.
      - **Pause the AI in an inbox.** In the inbox's AI settings, switch off "IA ativa nesta caixa" to pause the AI there whenever you need.
      - **Ready-made WhatsApp templates.** The Meta Templates page has a new "Kit Auris" tab with reminder and confirmation templates ready to use, already filled with the clinic's name and hours.

      ### ⚡ Improvements

      - **The AI icon always shows in the conversation list.** The agent now appears as a small avatar (hover to see the name), so long names no longer hide the AI on/off icon.
    pt_BR: |-
      ### ✨ Novidades

      - **Nova página Início.** Ao entrar no AurisChat, você cai no Início: o resumo do dia e os números da clínica (leads, agendamentos, follow-up, faltas, comparecimentos e o trabalho da IA) num só lugar. Clique em qualquer número para ver as conversas por trás dele.
      - **Desligar a IA para um contato.** Na página do contato ou no painel lateral da conversa, desligue "IA responde este contato" para quem a IA não deve responder, como os médicos da clínica ou parceiros. As mensagens dessa pessoa passam a chegar com a IA desligada, em qualquer conversa.
      - **Pausar a IA numa caixa de entrada.** Nas configurações de IA da caixa, desligue "IA ativa nesta caixa" para pausar a IA ali quando precisar.
      - **Templates de WhatsApp prontos.** A página de Templates da Meta ganhou a aba "Kit Auris", com modelos de lembrete e confirmação prontos para usar, já com o nome e o horário da clínica.

      ### ⚡ Melhorias

      - **O ícone da IA sempre aparece na lista de conversas.** O atendente agora aparece como uma bolinha com as iniciais (passe o mouse para ver o nome), e nomes longos não escondem mais o ícone de ligar/desligar a IA.
- tag: v4.15.1-auris.1.75
  published_at: '2026-11-07T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.75
  notes:
    en: |-
      ### ✨ What's new

      - **Mention alerts.** When someone on the team tags you in a note, the Mentions item shows how many conversations you haven't seen yet, and they stay highlighted until you open them.
      - **Label filter in the funnel.** You can now show only the patients with a given label in the funnel, with each label's color.
      - **A warning before writing to patients who opted out.** When you start a conversation with a patient who asked not to receive messages, a warning shows up before you send.

      ### ⚡ Improvements

      - **Easier template names.** When you create a template, the name adjusts itself to the format Meta accepts.
      - **A clearer note when the AI turns off by the schedule.** The conversation now shows only "IA desligada pelo horário".

      ### 🐛 Fixes

      - **Messages while WhatsApp was disconnected.** Messages that arrived while WhatsApp was disconnected now show up in the conversations.
    pt_BR: |-
      ### ✨ Novidades

      - **Aviso de menções.** Quando alguém da equipe te marca numa nota, o item Menções mostra quantas conversas você ainda não viu, e elas ficam destacadas até você abrir.
      - **Filtro por etiqueta no funil.** Agora dá para ver no funil só os pacientes com uma etiqueta, com a cor de cada uma.
      - **Aviso ao escrever para quem pediu para não receber mensagens.** Ao começar uma conversa com esse paciente, aparece um aviso antes de enviar.

      ### ⚡ Melhorias

      - **Nome do template mais fácil.** Ao criar um template, o nome se ajusta sozinho ao formato que a Meta aceita.
      - **Aviso mais claro quando a IA desliga pelo horário.** A conversa mostra só "IA desligada pelo horário".

      ### 🐛 Correções

      - **Mensagens com o WhatsApp desconectado.** As mensagens que chegaram enquanto o WhatsApp estava desconectado agora aparecem nas conversas.
- tag: v4.15.1-auris.1.74
  published_at: '2026-11-05T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.74
  notes:
    en: |-
      ### ✨ What's new

      - **Past conversations when moving from WhatsApp Business.** When the number you use in the WhatsApp Business app is connected to AurisChat and you choose to share its history, the last 90 days of conversations and the names saved on the phone show up in AurisChat. Past conversations come in resolved, and the AI doesn't reply to them.

      ### ⚡ Improvements

      - **The AurisChat name on every screen.** The panel and the website chat now show the AurisChat name everywhere.

      ### 🐛 Fixes

      - **Funnel conversion report.** On accounts with many conversations, the Funnel → Conversion tab showed up empty with an error. It now loads normally, and if something fails you get a "Tentar novamente" button.
      - **Inboxes after signing in again.** If you signed out and back in to AurisChat with another tab open, your inboxes could disappear and stay on "Carregando caixas de entrada". They now show up normally.
      - **A notice when your session ends.** If you sign out of AurisChat in one tab, the other open tabs now show "Sua sessão foi encerrada" and go back to the login screen, instead of staying on empty screens.
    pt_BR: |-
      ### ✨ Novidades

      - **Conversas antigas ao migrar do WhatsApp Business.** Quando o número que vocês usam no app WhatsApp Business é conectado ao AurisChat e vocês escolhem compartilhar o histórico, as conversas dos últimos 90 dias e os nomes salvos na agenda do celular aparecem no AurisChat. As conversas antigas entram como resolvidas, e a IA não responde a elas.

      ### ⚡ Melhorias

      - **O nome AurisChat em todas as telas.** O painel e o chat do site passam a mostrar o nome AurisChat em todo lugar.

      ### 🐛 Correções

      - **Relatório de conversão do funil.** Em contas com muitas conversas, a aba Funil → Conversão aparecia vazia, com uma mensagem de erro. Agora ela carrega normalmente, e se algo falhar aparece o botão "Tentar novamente".
      - **Caixas de entrada ao entrar de novo.** Se você saía e entrava de novo no AurisChat com outra aba aberta, as caixas de entrada podiam sumir e ficar em "Carregando caixas de entrada". Agora elas aparecem normalmente.
      - **Aviso quando a sessão termina.** Se você sair do AurisChat em uma aba, as outras abas abertas agora mostram "Sua sessão foi encerrada" e voltam para a tela de login, em vez de ficarem com as telas vazias.
- tag: v4.15.1-auris.1.73
  published_at: '2026-10-28T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.73
  notes:
    en: |-
      ### ✨ What's new

      - **Hours with the AI off.** In the inbox settings you can choose the hours when the AI doesn't reply. In those hours, when a patient writes, the conversation goes straight to the team, and the AI keeps the context for when you hand it back.
      - **WhatsApp groups in AurisChat.** Groups your number is part of now show up in the conversation list, and you can reply to them right there. The AI never replies in groups.
      - **See who receives a campaign.** When a campaign goes to a saved audience, "See audience" shows the list of contacts and who is left out.

      ### ⚡ Improvements

      - **Inbox timezone.** In the inbox settings you choose the timezone, and the business hours and the hours with the AI off follow it. New inboxes already start on Brasília time.

      ### 🐛 Fixes

      - **Campaigns in a new conversation.** In inboxes set to create new conversations, a campaign sent to a patient whose last conversation was resolved now starts a new conversation, instead of writing in the resolved one.
      - **Campaigns that didn't go out.** On some accounts, a WhatsApp campaign showed as completed without sending the messages. It now goes out to the whole list.
    pt_BR: |-
      ### ✨ Novidades

      - **Horário da IA desligada.** Nas configurações da caixa dá para escolher os horários em que a IA não responde. Nesses horários, quando o paciente escreve, a conversa vai direto para a equipe, e a IA guarda o contexto para quando vocês devolverem a conversa a ela.
      - **Grupos do WhatsApp no AurisChat.** Os grupos de que o número participa passam a aparecer na lista de conversas, e dá para responder neles por ali. A IA nunca responde nos grupos.
      - **Ver quem recebe a campanha.** Quando a campanha vai para um público salvo, o "Ver público" mostra a lista de contatos e quem fica de fora.

      ### ⚡ Melhorias

      - **Fuso horário da caixa.** Nas configurações da caixa você escolhe o fuso horário, e o horário de funcionamento e o horário da IA desligada seguem esse fuso. As caixas novas já começam no horário de Brasília.

      ### 🐛 Correções

      - **Campanha em conversa nova.** Nas caixas configuradas para criar novas conversas, a campanha enviada a um paciente cuja última conversa estava resolvida agora abre uma conversa nova, em vez de escrever na conversa resolvida.
      - **Campanhas que não saíam.** Em algumas contas, a campanha de WhatsApp aparecia como concluída sem enviar as mensagens. Agora ela sai para toda a lista.
- tag: v4.15.1-auris.1.72
  published_at: '2026-10-22T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.72
  notes:
    en: |-
      ### ✨ What's new

      - **"Doesn't want marketing" on the contact.** On the contact page you can turn on the opt-out for a patient who asked not to get offers. Campaigns and follow-ups stop going to them, and replies and reminders keep working normally.
      - **Audiences.** In Marketing → Audiences you save contact lists to reuse, for example "everyone in Qualifying this month". From a Conversations filter or a funnel column, "Save as audience" creates the list in one click.
      - **Campaign to an audience, and download.** A WhatsApp campaign can go straight to a saved audience, and admins and managers can download the list as a spreadsheet.
      - **Previous conversations inside the conversation.** At the top of a conversation, "Open previous conversation" shows the patient's earlier conversation in the same inbox, whole, without leaving the current one. You can keep opening them one by one, back to the first.
      - **Campaign results in the funnel.** Campaigns sent from AurisChat now show in the Conversions report, with how many patients replied, booked and attended. The conversations they start get the "Disparo interno" origin.

      ### ⚡ Improvements

      - **"Site" origin.** You can now mark that a patient came from the clinic's website in the conversation's "Lead origin" field, and find them in the filters and in the origin report.
      - **Previous conversations in a fixed order.** The side list shows conversations from newest to oldest and no longer reshuffles when a message arrives. After 20, a "See more" button loads the rest.

      ### 🐛 Fixes

      - **"Load more" in the funnel.** The button now sits at the end of the column, after the last card.
    pt_BR: |-
      ### ✨ Novidades

      - **"Não quer receber marketing" no contato.** Na página do contato dá para ligar o opt-out do paciente que pediu para não receber ofertas. Campanhas e follow-ups param de chegar para ele, e as respostas e os lembretes continuam normais.
      - **Públicos.** Em Marketing → Públicos você guarda listas de contatos para usar de novo, por exemplo "todos em Qualificação este mês". Num filtro de Conversas ou numa coluna do funil, o "Salvar como público" cria a lista com um clique.
      - **Disparo para um público e download.** A campanha de WhatsApp pode ir direto para um público salvo, e administradores e gerentes podem baixar a lista em planilha.
      - **Conversas anteriores dentro da conversa.** No topo da conversa, "Abrir conversa anterior" mostra a conversa anterior do paciente na mesma caixa, inteira, sem sair da conversa atual. Dá para ir abrindo uma por uma, até a primeira.
      - **Resultado das campanhas no funil.** As campanhas enviadas pelo AurisChat aparecem no relatório de Conversões, com quantos pacientes responderam, agendaram e compareceram. As conversas que elas iniciam ganham a origem "Disparo interno".

      ### ⚡ Melhorias

      - **Origem "Site".** Agora dá para marcar que o paciente chegou pelo site da clínica, no campo "Origem do lead" da conversa, e encontrar esses pacientes nos filtros e no relatório por origem.
      - **Conversas anteriores em ordem fixa.** A lista lateral mostra as conversas da mais nova para a mais antiga e não muda mais de ordem quando chega mensagem. Depois de 20, o botão "Ver mais" carrega as demais.

      ### 🐛 Correções

      - **"Carregar mais" do funil.** O botão agora fica no fim da coluna, depois do último card.
