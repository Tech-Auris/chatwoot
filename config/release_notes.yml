- tag: v4.15.1-auris.1.86
  published_at: '2026-11-26T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.86
  notes:
    en: |-
      ### ✨ What's new

      - **Voice notes on private notes.** You can now record audio straight into a Private note. It stays with the team and is never sent to the patient.

      ### ⚡ Improvements

      - **The assistant's audio arrives as a voice message.** When the assistant replies with audio, the patient gets it as a voice message, just like one recorded on the phone.
      - **Today stands out in the Agenda.** In the Agenda's week view, today is highlighted and the days that have passed show in gray, so you can see at a glance where you are in the week. Only for clinics with their scheduling system connected.

      ### 🐛 Fixes

      - **Blocked contacts stay out.** On WhatsApp connected by QR Code, messages from a blocked contact no longer show up in conversations or reach the assistant. Unblock them and everything goes back to normal.
      - **Photo albums and animated stickers.** When the patient sends several photos at once or an animated sticker, they now show up normally in the conversation instead of "unsupported message".
    pt_BR: |-
      ### ✨ Novidades

      - **Áudio na nota privada.** Agora você pode gravar um áudio direto na Nota privada. Ele fica só para a equipe e nunca é enviado ao paciente.

      ### ⚡ Melhorias

      - **Áudio da assistente chega como mensagem de voz.** Quando a assistente responde em áudio, o paciente recebe como mensagem de voz, igual a um áudio gravado no celular.
      - **Dia de hoje em destaque na Agenda.** Na visão da semana da Agenda, o dia de hoje fica destacado e os dias que já passaram aparecem em cinza, para você ver de relance em que ponto da semana está. Só para clínicas com o sistema de agenda integrado.

      ### 🐛 Correções

      - **Contato bloqueado não aparece mais.** No WhatsApp conectado por QR Code, as mensagens de um contato bloqueado não entram mais nas conversas nem chegam à assistente. Ao desbloquear, tudo volta ao normal.
      - **Álbuns de fotos e figurinhas animadas.** Quando o paciente manda várias fotos de uma vez ou uma figurinha animada, elas aparecem normalmente na conversa, em vez de "mensagem não suportada".
