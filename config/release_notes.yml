---
- tag: v4.15.1-auris.1.42.0
  published_at: '2026-08-12T14:45:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.42.0
  notes:
    en: |-
      ### ⚡ Improvements

      - **The Edit button on a template respects Meta's rules.** Meta only accepts edits on templates whose status is Approved. On any other status the Edit button is now disabled with a short line explaining why — instead of letting you fill the form and only find out at save time.

      ### 🐛 Fixes

      - **A new template appears on the list right after you create it.** Creating a new template used to bounce you back to the list without it, and you had to refresh the page to see it. The list now includes the just-created template immediately.
    pt_BR: |-
      ### ⚡ Melhorias

      - **O botão Editar de um template respeita as regras da Meta.** A Meta só aceita edições em templates com status Aprovado. Em qualquer outro status o botão Editar fica desabilitado com uma linha curta explicando o motivo — em vez de deixar você preencher o formulário e só descobrir na hora de salvar.

      ### 🐛 Correções

      - **Template novo aparece na lista logo após criar.** Ao criar um novo template você voltava pra lista e ele não estava lá — precisava dar refresh na página pra ver. A lista agora já mostra o template recém-criado na hora.
- tag: v4.15.1-auris.1.41.23
  published_at: '2026-08-12T00:15:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.41.23
  notes:
    en: |-
      ### 🐛 Fixes

      - **The Meta Templates page opens again.** The "New template" and "Edit template" screens were opening blank right after the previous release. Both work normally now.

      ### ⚡ Improvements

      - **Templates load themselves when you open the page.** If the list is empty when you open Templates Meta on an inbox, AurisChat now syncs with Meta automatically instead of showing a blank list. The Sincronizar button still works the same.
    pt_BR: |-
      ### 🐛 Correções

      - **A tela de Templates Meta volta a abrir.** As telas "Novo template" e "Editar template" estavam abrindo em branco desde a versão anterior. Voltam a funcionar normalmente agora.

      ### ⚡ Melhorias

      - **A lista de templates carrega sozinha ao abrir a página.** Se a lista estiver vazia quando você abrir Templates Meta numa caixa, o AurisChat agora sincroniza com a Meta automaticamente em vez de mostrar lista em branco. O botão Sincronizar continua funcionando igual.
- tag: v4.15.1-auris.1.41.22
  published_at: '2026-08-11T22:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.41.22
  notes:
    en: |-
      ### ✨ What's new

      - **New "Templates Meta" section.** You can now browse, create, edit and delete WhatsApp templates directly inside AurisChat, without opening Business Manager. Each template shows a usage summary for the last few days (how many were sent, delivered and read), and you get an on-screen notice the moment Meta approves or rejects a template.

      ### 🐛 Fixes

      - **Templates with a variable in the header work again.** Templates that had a variable in the header (like "Hi {{name}}") were failing to send. They now work normally.
      - **Template messages in the history show everything the customer saw.** When you sent a template with a header or footer, the conversation history only showed the body. It now shows the whole thing, matching what the customer received on WhatsApp.
      - **Fewer false "failed to send" alerts.** Brief WhatsApp hiccups used to instantly flag a message as failed. It now retries by itself before giving up.
    pt_BR: |-
      ### ✨ Novidades

      - **Nova seção Templates Meta.** Agora dá pra ver, criar, editar e excluir os templates de WhatsApp direto pelo AurisChat, sem abrir o Business Manager. Cada template mostra um resumo de uso dos últimos dias (quantas foram enviadas, entregues e lidas), e você recebe um aviso na tela na hora que a Meta aprova ou rejeita um template.

      ### 🐛 Correções

      - **Template com variável no cabeçalho volta a funcionar.** Templates que tinham uma variável no cabeçalho (tipo "Olá {{nome}}") estavam falhando no envio. Agora funcionam normalmente.
      - **Mensagem de template no histórico mostra tudo que o cliente viu.** Quando você enviava um template com cabeçalho ou rodapé, o histórico da conversa mostrava só o corpo. Agora aparece completo, igual ao que o cliente recebeu no WhatsApp.
      - **Menos alertas de "falha ao enviar" falsos.** Erros passageiros do WhatsApp (uma travadinha momentânea) marcavam a mensagem como falha imediatamente. Agora ela tenta de novo sozinha antes de dizer que falhou.
- tag: v4.15.1-auris.1.41.21
  published_at: '2026-08-06T14:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.41.21
  notes:
    en: |-
      ### 🐛 Fixes

      - **No more repeated "Assigned to X" lines on a conversation.** When the system auto-assigned a conversation, the timeline sometimes showed several identical "Assigned to X" entries within a few seconds. Now only one shows up.
      - **The Funnel report tapers again.** In the "Conversion Funnel" report, the first column would sometimes end up smaller than a later column, making the funnel look broken. The first column now rolls up every conversation that moved through the funnel in the period, and the conversion rates use it as the denominator — so rates may read a bit lower for accounts that receive leads that first entered in earlier periods.
    pt_BR: |-
      ### 🐛 Correções

      - **Sem repetições de "Atribuído a X" na conversa.** Quando o sistema atribuía a conversa automaticamente, às vezes apareciam várias linhas iguais de "Atribuído a X" em poucos segundos. Agora aparece só uma.
      - **Relatório de Funil volta a fazer sentido.** No relatório "Funil de Conversão", a primeira coluna às vezes ficava menor que uma seguinte, dando impressão de funil errado. Agora a primeira coluna já engloba todas as conversas que passaram pelo funil no período, e as taxas de conversão usam esse mesmo número — então elas podem aparecer um pouco menores para contas que recebem leads que entraram no funil em períodos anteriores.
