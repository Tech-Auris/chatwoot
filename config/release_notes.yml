- tag: v4.15.1-auris.1.41.19
  published_at: '2026-08-04T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.41.19
  notes:
    en: |-
      ### 🐛 Fixes

      - **AI handoff to the team picks an agent again on its own.** When the AI passes a conversation to the team a second time, an agent is auto-assigned again — no more picking one manually.
      - **WhatsApp template messages with line breaks or extra spaces now go through.** Templates that Meta was rejecting with no clear reason now send normally.
    pt_BR: |-
      ### 🐛 Correções

      - **A passagem da IA para o time volta a escolher um atendente sozinha.** Quando a IA passa uma conversa para a equipe uma segunda vez, o sistema volta a atribuir um atendente automaticamente — antes você precisava atribuir na mão.
      - **Mensagens de template do WhatsApp com quebras de linha ou espaços extras agora saem sem erro.** Aqueles templates que a Meta rejeitava sem explicação passam a ser enviados normalmente.
- tag: v4.15.1-auris.1.41.18
  published_at: '2026-07-20T14:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.41.18
  notes:
    en: |-
      ### 🐛 Fixes

      - **Messages sent from the "New conversation" pencil no longer stay stuck on "sent".** The previous fixes handled contacts created via inbound messages; this covers contacts created directly from the pencil, which had a separate creation path that skipped the phone canonicalization.
    pt_BR: |-
      ### 🐛 Correções

      - **Mensagens enviadas pelo lápis de "Nova conversa" não travam mais em "enviada".** As correções anteriores pegaram contatos criados por mensagem recebida; essa cobre contatos criados direto pelo lápis, que tinham um caminho de criação separado que pulava a canonicalização do telefone.
- tag: v4.15.1-auris.1.41.17
  published_at: '2026-07-19T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.41.17
  notes:
    en: |-
      ### 🐛 Fixes

      - **Messages to more Brazilian numbers stop getting stuck on "sent".** The previous fix caught most cases; this one covers the remaining stuck contacts by trusting exactly what WhatsApp reports as the canonical routing form for each number.
    pt_BR: |-
      ### 🐛 Correções

      - **Mensagens para mais números brasileiros deixam de travar em "enviada".** A correção anterior pegou a maioria dos casos; essa cobre os contatos que sobraram travados usando exatamente o formato que o WhatsApp indica como certo pra rotear cada número.
- tag: v4.15.1-auris.1.41.16
  published_at: '2026-07-17T22:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.41.16
  notes:
    en: |-
      ### 🐛 Fixes

      - **Messages to Brazilian numbers stop getting stuck on "sent".** Contacts with a Brazilian phone that WhatsApp routes under the older 12-digit format were failing to deliver. Messages sent to new contacts now reach WhatsApp normally.
    pt_BR: |-
      ### 🐛 Correções

      - **Mensagens para números brasileiros deixam de travar em "enviada".** Contatos com número brasileiro cuja conta do WhatsApp está registrada no formato antigo de 12 dígitos não estavam entregando. Mensagens para contatos novos agora chegam no WhatsApp normalmente.
