- tag: v4.15.1-auris.1.48
  published_at: '2026-08-19T19:30:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.48
  notes:
    en: |-
      ### ✨ What's new

      - **Notifications for mentions and direct messages in the internal chat.** When a colleague mentions you or sends you a direct message, you get a notification like any other — and you can turn each one off in your profile.

      ### 🐛 Fixes

      - **The connection light of an inbox tells the truth.** It could stay green after WhatsApp had disconnected, even after reloading the page, so nobody noticed the inbox had gone quiet.
      - **An inbox stuck out of WhatsApp recovers.** When the connection cannot be re-established, reconnecting now discards the dead session instead of retrying it forever, and the message on screen says what actually solves it.
      - **The campaign audience file says which row was left out and why.** It used to report only how many rows were skipped, with no way to know what to fix in the spreadsheet.
    pt_BR: |-
      ### ✨ Novidades

      - **Notificação de menção e mensagem direta no chat interno.** Quando alguém te menciona ou te manda uma mensagem direta, você recebe uma notificação como qualquer outra — e pode desligar cada uma delas no seu perfil.

      ### 🐛 Correções

      - **A luz de conexão da caixa de entrada mostra a verdade.** Ela podia continuar verde depois que o WhatsApp tinha caído, mesmo recarregando a página, e ninguém percebia que a caixa estava parada.
      - **Caixa que sai do WhatsApp e não volta agora se recupera.** Quando a conexão não consegue ser restabelecida, reconectar passa a descartar a sessão morta em vez de insistir nela, e a mensagem da tela diz o que realmente resolve.
      - **O arquivo de público da campanha diz qual linha ficou de fora e por quê.** Antes aparecia só a quantidade de linhas ignoradas, sem indicar o que corrigir na planilha.
- tag: v4.15.1-auris.1.47
  published_at: '2026-08-19T02:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.47
  notes:
    en: |-
      ### ⚡ Improvements

      - **The campaign report opens with the campaign on top.** Template, inbox, schedule, audience and cadence are right there, so you can tell which campaign you are looking at without going back.

      ### 🐛 Fixes

      - **The report shows when each message actually went out.** It used to show the moment the message was prepared, which is the same instant for the whole campaign — a campaign spaced by one minute looked like everything left at once.
      - **Contacts from a spreadsheet keep the name you gave them.** When the phone number already existed in the system with no name, or with the number itself as the name, the name from the file is now applied instead of being dropped.
    pt_BR: |-
      ### ⚡ Melhorias

      - **O relatório da campanha abre com a campanha no topo.** Modelo, caixa de entrada, agendamento, público e cadência ficam à vista, então dá para saber de qual campanha é o relatório sem voltar.

      ### 🐛 Correções

      - **O relatório mostra quando cada mensagem realmente saiu.** Antes mostrava o momento em que a mensagem foi preparada, que é o mesmo para a campanha inteira — uma campanha espaçada de 1 minuto parecia ter saído tudo junto.
      - **Contatos vindos de planilha ficam com o nome que você informou.** Quando o telefone já existia no sistema sem nome, ou com o próprio número no lugar do nome, o nome do arquivo passa a ser aplicado em vez de descartado.
- tag: v4.15.1-auris.1.46
  published_at: '2026-08-18T22:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.46
  notes:
    en: |-
      ### ✨ What's new

      - **Quick replies can now belong to a single inbox.** When creating one you choose whether it shows up everywhere or only in one inbox. Typing "/" in a conversation offers the general ones plus that inbox's, so the list stops filling up with replies meant for another channel.
      - **WhatsApp campaigns send at your pace.** You choose the interval between one message and the next, from 10 seconds up to 5 minutes, instead of everything leaving at once. Replies you are typing no longer wait in line behind a campaign.
      - **Campaign audience from a spreadsheet.** Besides picking customer labels, you can upload a CSV with the contacts. New ones are created and the ones already in the system are matched by phone number. There is a sample file to download.
      - **Check who will receive the campaign.** A "Ver público" button lists everyone before you schedule it, and points out who has no phone number and therefore won't receive it.
      - **Campaign report.** Each campaign now has a report with the totals — sent, delivered, read and failed — and one line per contact, with the reason when something failed and a link that opens the conversation.
      - **Tag the campaign conversations.** You can choose a label to be applied to every conversation the campaign touches, making them easy to find afterwards.
    pt_BR: |-
      ### ✨ Novidades

      - **Respostas prontas agora podem ser de uma caixa de entrada só.** Ao criar, você escolhe se ela aparece em todas ou apenas em uma caixa. Digitando "/" na conversa aparecem as gerais mais as daquela caixa, então a lista para de encher com respostas de outro canal.
      - **Campanhas de WhatsApp enviam no seu ritmo.** Você escolhe o intervalo entre uma mensagem e a próxima, de 10 segundos até 5 minutos, em vez de sair tudo de uma vez. As respostas que você está digitando deixam de ficar na fila atrás da campanha.
      - **Público da campanha por planilha.** Além de escolher etiquetas dos clientes, dá para enviar um CSV com os contatos. Os novos são criados e os que já existem são reconhecidos pelo telefone. Tem um arquivo de exemplo para baixar.
      - **Conferir quem vai receber a campanha.** O botão "Ver público" lista todo mundo antes de agendar, e avisa quem está sem telefone e por isso não vai receber.
      - **Relatório da campanha.** Cada campanha passa a ter um relatório com os totais — enviadas, entregues, lidas e falhas — e uma linha por contato, com o motivo quando algo falhou e um link que abre a conversa.
      - **Etiquetar as conversas da campanha.** Você pode escolher uma etiqueta para ser aplicada em todas as conversas que a campanha tocar, o que facilita encontrá-las depois.
- tag: v4.15.1-auris.1.45
  published_at: '2026-08-17T17:10:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.45
  notes:
    en: |-
      ### 🐛 Fixes

      - **Replaying an audio works again.** Shortly after a voice message arrived, the player would show "audio unavailable" and only came back after reloading the page. Now you can listen as many times as you need.
    pt_BR: |-
      ### 🐛 Correções

      - **Ouvir um áudio de novo voltou a funcionar.** Pouco depois de a mensagem de voz chegar, o player passava a mostrar "Áudio indisponível" e só voltava recarregando a página. Agora dá para ouvir quantas vezes precisar.
- tag: v4.15.1-auris.1.44
  published_at: '2026-08-15T03:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.44
  notes:
    en: |-
      ### ✨ What's new

      - **Filter by AI status.** In the inbox you can now show only the conversations with the AI on, or only the ones with the AI off.

      ### ⚡ Improvements

      - **The new WhatsApp campaign window no longer closes on its own.** Clicking outside it doesn't erase what you filled in — it only closes on Cancel or Create.

      ### 🐛 Fixes

      - **The conversation history shows who turned the AI on or off.** Before, when the change was automatic, it only read "AI turned on", without saying where it came from.
      - **The funnel no longer shows R$ 0,00.** When the account has no average ticket set, the amounts simply don't appear instead of showing zero.
    pt_BR: |-
      ### ✨ Novidades

      - **Filtro por status da IA.** Na caixa de entrada você já pode mostrar só as conversas que estão com a IA ligada, ou só as que estão com a IA desligada.

      ### ⚡ Melhorias

      - **A janela de nova campanha do WhatsApp não fecha mais sozinha.** Clicar fora dela não apaga mais o que você preencheu — ela só fecha em Cancelar ou Criar.

      ### 🐛 Correções

      - **O histórico da conversa mostra quem ligou ou desligou a IA.** Antes, quando a mudança era automática, aparecia só "IA acionada", sem dizer de onde veio.
      - **O funil não mostra mais R$ 0,00.** Quando a conta não tem ticket médio configurado, os valores simplesmente não aparecem, em vez de mostrar zero.
- tag: v4.15.1-auris.1.43
  published_at: '2026-08-13T22:40:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.43
  notes:
    en: |-
      ### ✨ What's new

      - **Managers get access to Automations and CSAT reports.** Team managers can now create automations and read the customer satisfaction report on their inboxes without needing an administrator.

      ### 🐛 Fixes

      - **WhatsApp templates using named variables ({{name}}) work.** The template creation form now accepts placeholders with a name — Meta was rejecting templates that used them.
    pt_BR: |-
      ### ✨ Novidades

      - **Gerentes têm acesso às Automações e ao Relatório CSAT.** Gerentes de equipe agora criam automações e consultam o relatório de satisfação nas suas caixas sem depender de um administrador.

      ### 🐛 Correções

      - **Templates do WhatsApp com variáveis nomeadas ({{nome}}) funcionam.** O formulário de criação de templates passa a aceitar placeholders com nome — a Meta rejeitava templates que usavam essa forma.
- tag: v4.15.1-auris.1.42.6
  published_at: '2026-08-13T03:20:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.42.6
  notes:
    en: |-
      ### 🐛 Fixes

      - **Meta Templates page reflects the latest data every time you land on it.** After creating or editing a template, the list sometimes still showed the pre-change state because the page was reused from cache without refreshing. It now refreshes on every visit, so the change you just made is always visible right away.
      - **The Templates page stops hanging on "Loading templates..." after a hard refresh.** In some cases the loading spinner never cleared. It now resolves whether inboxes finish loading or not.
    pt_BR: |-
      ### 🐛 Correções

      - **A página Templates Meta reflete os dados mais recentes toda vez que você entra nela.** Depois de criar ou editar um template, a lista às vezes continuava mostrando o estado anterior porque a página era reaproveitada do cache sem atualizar. Agora ela recarrega em toda visita, então a mudança que você acabou de fazer aparece sempre na hora.
      - **A página de Templates não trava mais em "Carregando templates..." após refresh forçado.** Em alguns casos o spinner não sumia. Agora ele resolve independente do carregamento das caixas terminar.
- tag: v4.15.1-auris.1.42.5
  published_at: '2026-08-12T23:30:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.42.5
  notes:
    en: |-
      ### 🐛 Fixes

      - **A newly created or edited Meta template appears immediately on the list, always.** The previous release fixed some of the cases but not all — depending on timing, the list still sometimes came back showing pre-write data and you had to click Sincronizar. Now the list renders straight from the action's response, without a follow-up refresh that could regress it.
      - **The "What's new" modal stops flooding the browser console with errors.** Every time a version note appeared, the console filled with "Maximum call stack size exceeded" caused by the modal calling its own close handler in a loop. Fixed.
    pt_BR: |-
      ### 🐛 Correções

      - **Um template Meta recém-criado ou editado aparece imediatamente na lista, sem falha.** A release anterior corrigia alguns casos mas não todos — dependendo do timing, a lista às vezes voltava com dados de antes do save e você precisava clicar em Sincronizar. Agora a lista renderiza direto a partir da resposta da ação, sem um refresh subsequente que podia regredir.
      - **O modal "Novidades" não enche mais o console de erros.** Toda vez que aparecia uma nota de versão nova, o console enchia de "Maximum call stack size exceeded" causado pelo modal chamando o próprio fechamento em loop. Corrigido.
- tag: v4.15.1-auris.1.42.4
  published_at: '2026-08-12T21:25:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.42.4
  notes:
    en: |-
      ### 🐛 Fixes

      - **A newly created or edited Meta template appears immediately on the list.** Previously, after creating or editing a template, you were sent back to the list without your change reflected, and had to click Sincronizar to see it. The list now renders straight from the response of the action you just took, so what you did is visible right away.
    pt_BR: |-
      ### 🐛 Correções

      - **Um template Meta recém-criado ou editado aparece imediatamente na lista.** Antes, ao criar ou editar um template, você era enviado de volta pra lista sem a sua mudança refletida e precisava clicar em Sincronizar pra ver. A lista agora renderiza direto a partir da resposta da ação que você acabou de fazer, então o que você fez fica visível na hora.
- tag: v4.15.1-auris.1.42.3
  published_at: '2026-08-12T18:50:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.42.3
  notes:
    en: |-
      ### 🐛 Fixes

      - **An edited Meta template shows as Pending right after you save.** The templates page used to still show Approved after you saved an edit, and only flipped to Pending when you clicked Sincronizar manually. The template now shows Pending as soon as you're back on the list.
    pt_BR: |-
      ### 🐛 Correções

      - **Um template Meta editado já aparece como Pendente logo após salvar.** A página de templates continuava mostrando Aprovado depois de salvar uma edição, e só virava Pendente ao clicar em Sincronizar manualmente. Agora o template já aparece como Pendente assim que você volta pra lista.
- tag: v4.15.1-auris.1.42.2
  published_at: '2026-08-12T17:45:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.42.2
  notes:
    en: |-
      ### 🐛 Fixes

      - **Templates Meta stops hanging on "Loading templates…".** After the previous release, opening Templates Meta from within a session that already had inboxes loaded (i.e. reaching it from any other page) would leave the page spinning forever. It now loads the list normally.
    pt_BR: |-
      ### 🐛 Correções

      - **Templates Meta não trava mais em "Carregando templates…".** Depois da release anterior, abrir Templates Meta a partir de uma sessão que já tinha as caixas carregadas (ou seja, chegando pela sidebar depois de estar em outra tela) deixava a página girando pra sempre. Agora carrega a lista normalmente.
- tag: v4.15.1-auris.1.42.1
  published_at: '2026-08-12T16:50:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.42.1
  notes:
    en: |-
      ### 🐛 Fixes

      - **Deleting a Meta template works again.** Meta was rejecting the delete with a permission error even for tokens that could create and send templates normally. The delete flow now uses Meta's more precise endpoint, which accepts the same permissions the rest of the template flow already uses.
      - **Templates Meta stops flashing "no Cloud inbox connected" on hard refresh.** After a hard refresh (Ctrl+Shift+R) the screen used to briefly (and sometimes stubbornly) show "no Cloud inbox connected" while the inboxes were still loading. Now you see a spinner until the list is known, then the templates.
    pt_BR: |-
      ### 🐛 Correções

      - **Excluir um template Meta volta a funcionar.** A Meta estava recusando a exclusão com erro de permissão mesmo em tokens que criam e enviam templates normalmente. A exclusão agora usa o endpoint mais preciso da Meta, que aceita o mesmo escopo já usado no resto do fluxo de templates.
      - **Templates Meta não pisca mais "sem caixa Cloud conectada" no refresh forçado.** Depois de um Ctrl+Shift+R a tela mostrava brevemente (às vezes de forma persistente) "sem caixa Cloud conectada" enquanto as caixas ainda carregavam. Agora aparece um spinner até termos a lista, e depois os templates.
- tag: v4.15.1-auris.1.42.0
  published_at: '2026-08-12T14:45:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.42.0
  notes:
    en: |-
      ### ⚡ Improvements

      - **The Edit button on a template respects Meta's rules.** Meta only accepts edits on templates whose status is Approved. On any other status the Edit button is now disabled with a short line explaining why — instead of letting you fill the form and only find out at save time.

      ### 🐛 Fixes

      - **A new template appears on the list right after you create it.** Creating a new template used to bounce you back to the list without it, and you had to refresh the page to see it. The list now includes the just-created template immediately.
    pt_BR: |-
      ### ⚡ Melhorias

      - **O botão Editar de um template respeita as regras da Meta.** A Meta só aceita edições em templates com status Aprovado. Em qualquer outro status o botão Editar fica desabilitado com uma linha curta explicando o motivo — em vez de deixar você preencher o formulário e só descobrir na hora de salvar.

      ### 🐛 Correções

      - **Template novo aparece na lista logo após criar.** Ao criar um novo template você voltava pra lista e ele não estava lá — precisava dar refresh na página pra ver. A lista agora já mostra o template recém-criado na hora.
