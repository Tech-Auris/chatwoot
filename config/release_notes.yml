- tag: v4.15.1-auris.1.53
  published_at: '2026-09-03T21:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.53
  notes:
    en: |-
      ### ⚡ Improvements

      - **Bigger logo on the proposal page.** The header logo on every step of the proposal is now larger, so the brand reads clearly on the page the prospect opens.

      ### 🐛 Fixes

      - **WhatsApp templates with an image header now go through.** Templates that carried a logo or banner on top were being rejected by Meta on every send, and the customer never received them. They now go out normally, and AurisChat recovers on its own when the image reference expires.
    pt_BR: |-
      ### ⚡ Melhorias

      - **Logo maior na página da proposta.** O logo do cabeçalho em cada etapa da proposta ficou maior, para a marca aparecer com destaque na tela que o cliente abre.

      ### 🐛 Correções

      - **Templates do WhatsApp com imagem no cabeçalho voltam a ser enviados.** Templates que carregavam um logo ou banner em cima estavam sendo recusados pela Meta a cada envio, e o cliente nunca recebia. Agora vão normalmente, e o sistema se recupera sozinho quando a referência da imagem expira.
- tag: v4.15.1-auris.1.52
  published_at: '2026-09-01T21:45:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.52
  notes:
    en: |-
      ### ✨ What's new

      - **Access screen with a box per digit.** Like a 2FA screen: the customer pastes the code from WhatsApp and it fills the boxes on its own; the registered number appears on the page so they can tell whether the record is theirs.
      - **Every proposal line shows monthly / semiannual / annual.** The customer sees the billing period of each line before signing — no surprise later about what is recurring.

      ### 🐛 Fixes

      - **Monthly card sign-up now creates a real subscription.** It had been sent to the instalment flow instead of becoming a recurring charge. Monthly now goes to the subscription processor; semiannual and annual keep going to the instalment link.
    pt_BR: |-
      ### ✨ Novidades

      - **Tela de acesso da proposta em blocos.** Cada dígito em uma caixinha, como o código do banco no celular: o cliente cola o código do WhatsApp e preenche sozinho; o número já cadastrado aparece na tela para ele conferir se é o dele.
      - **Cada item da proposta mostra "mensal", "semestral" ou "anual".** O cliente vê a recorrência de cada linha antes de assinar, sem surpresa depois sobre o que fica recorrente.

      ### 🐛 Correções

      - **Pagamento mensal no cartão vira assinatura mesmo.** Estava caindo em uma tela de parcelamento em vez de virar cobrança recorrente. Agora o mensal segue para a assinatura; o semestral e o anual continuam indo para o link de parcelamento.
