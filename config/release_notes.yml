---
- tag: v4.15.1-auris.1.69
  published_at: '2026-10-09T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.69
  notes:
    en: |-
      ### ✨ What's new

      - **Keep track of the conversation's follow-ups.** When the AI is following up with a patient who stopped replying, a small ring on the funnel card and in the conversation header shows which follow-up it is on (for example, 2 of 3). It is blue while waiting for the patient, red if the message could not be sent and amber when the follow-ups ended without an answer. Click it to see each follow-up sent and whether the patient replied.
    pt_BR: |-
      ### ✨ Novidades

      - **Acompanhe os follow-ups da conversa.** Quando a IA está fazendo follow-up com um paciente que parou de responder, um pequeno anel no card do funil e no cabeçalho da conversa mostra em qual follow-up ela está (por exemplo, 2 de 3). Ele fica azul enquanto aguarda o paciente, vermelho se a mensagem não pôde ser enviada e âmbar quando os follow-ups terminaram sem resposta. Clique nele para ver cada follow-up enviado e se o paciente respondeu.
- tag: v4.15.1-auris.1.68
  published_at: '2026-10-08T20:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.68
  notes:
    en: |-
      ### ✨ What's new

      - **See each template's quality.** When you pick a WhatsApp template (pencil, reply box or scheduling), it shows how Meta rates it: High, Medium or Low, with a tip when it's worth caution.

      ### ⚡ Improvements

      - **A warning when the number can't send.** If the number has a problem, the conversation tells you before you send. A disconnected number shows a button to reconnect, and a scheduled message that couldn't go out tells you why.
      - **Number status explained.** Hover over the number's status and quality to see what they mean.
      - **Dates as numbers when scheduling.** Scheduling shows dates like 08/10/2026 08:00, and typing a date starts from today's date and time.

      ### 🐛 Fixes

      - **Notices readable in dark mode.** The text of notices that disappeared on the dark theme now shows normally.
    pt_BR: |-
      ### ✨ Novidades

      - **Veja a qualidade de cada modelo.** Ao escolher um modelo do WhatsApp (pelo lápis, na caixa de resposta ou no agendamento), aparece a nota que o Meta dá a ele: Alta, Média ou Baixa, com uma dica quando vale tomar cuidado.

      ### ⚡ Melhorias

      - **Aviso quando o número não consegue enviar.** Se o número estiver com problema, a conversa avisa antes de você enviar. Um número desconectado mostra o botão para reconectar, e uma mensagem agendada que não pôde sair mostra o motivo.
      - **Status do número explicado.** Passe o mouse sobre o status e a qualidade do número para ver o que significam.
      - **Datas em números no agendamento.** O agendamento mostra datas como 08/10/2026 08:00, e ao digitar a data ela já vem com a data e hora de agora.

      ### 🐛 Correções

      - **Avisos legíveis no tema escuro.** O texto dos avisos que sumia no tema escuro agora aparece normalmente.
- tag: v4.15.1-auris.1.67
  published_at: '2026-10-07T18:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.67
  notes:
    en: |-
      ### ✨ What's new

      - **One form to schedule messages.** Scheduling from the conversation or from the Scheduled messages screen opens the same complete form, with attachment, template, recurrence and variables (type `{{`). From the Scheduled messages screen, you pick the patient and the number right in the form.
      - **Language in the quick contact edit.** The contact panel opened from the conversation now has the Language field.

      ### ⚡ Improvements

      - **Patients from ads can get a reply for 72 hours.** On official numbers, a patient who started the conversation from a WhatsApp ad can receive normal messages for up to 72 hours, as the conversation badge shows.
      - **Numbers that work are no longer blocked.** Some official numbers were shown as blocked while still sending; they can be picked again.
    pt_BR: |-
      ### ✨ Novidades

      - **Um só formulário para agendar mensagens.** Agendar pela conversa ou pela tela Mensagens agendadas abre o mesmo formulário completo, com anexo, modelo, recorrência e variáveis (digite `{{`). Pela tela de agendadas, você escolhe o paciente e o número no próprio formulário.
      - **Idioma na edição rápida do contato.** O painel do contato aberto pela conversa ganhou o campo Idioma.

      ### ⚡ Melhorias

      - **Pacientes de anúncio podem receber resposta por 72 horas.** Nos números oficiais, quem começou a conversa por um anúncio do WhatsApp pode receber mensagens normais por até 72 horas, como mostra o selo da conversa.
      - **Números que funcionam não aparecem mais como bloqueados.** Alguns números oficiais apareciam bloqueados mesmo enviando normalmente; eles voltam a poder ser escolhidos.
- tag: v4.15.1-auris.1.66
  published_at: '2026-10-06T12:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.66
  notes:
    en: |-
      ### ✨ What's new

      - **See if a number is working before you send.** When starting a conversation from the pencil, each number in "Via:" shows whether it is connected or, for official numbers, its quality (High, Medium, Low or Banned).
      - **Numbers with a problem are unavailable.** When starting a conversation, a disconnected or blocked number shows as unavailable with the reason, instead of letting the message get lost.

      ### ⚡ Improvements

      - **Messages and scheduled messages.** Each person edits their own messages and changes the scheduled messages they created. Admins and managers can still change all of them.
    pt_BR: |-
      ### ✨ Novidades

      - **Veja se o número está funcionando antes de enviar.** Ao começar uma conversa pelo lápis, cada número do campo "Via:" mostra se está conectado ou, nos números oficiais, a qualidade (Alta, Média, Baixa ou Banido).
      - **Números com problema ficam indisponíveis.** Ao começar uma conversa, um número desconectado ou bloqueado aparece apagado e mostra o motivo, em vez de deixar a mensagem se perder.

      ### ⚡ Melhorias

      - **Mensagens e agendamentos.** Cada pessoa edita as próprias mensagens e altera os agendamentos que criou. Administradores e gerentes continuam podendo mexer em todos.
- tag: v4.15.1-auris.1.65
  published_at: '2026-10-03T17:10:56Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.65
  notes:
    en: |-
      ### ✨ What's new

      - **AI status follows the assignment.** When you assign a conversation to the AI, its AI status turns on by itself. Assigning it to someone else or unassigning it turns it off.

      ### ⚡ Improvements

      - **The AI answers patients from ads right away.** When a patient's first message arrives as "unsupported message" (the yellow bubble), the AI now answers right away instead of waiting for the patient to write again.
      - **More faithful report times.** First response, resolution and waiting times now show the time within which 95% of conversations were handled. Hover over the number to see the typical time.
    pt_BR: |-
      ### ✨ Novidades

      - **Status da IA acompanha a atribuição.** Quando você atribui a conversa à IA, o status da IA liga sozinho. Ao atribuir a outra pessoa ou tirar a atribuição, ele desliga.

      ### ⚡ Melhorias

      - **A IA responde na hora pacientes vindos de anúncios.** Quando a primeira mensagem do paciente chega como "mensagem não suportada" (o balão amarelo), a IA agora responde na hora, sem esperar o paciente escrever de novo.
      - **Tempos dos relatórios mais fiéis.** Os tempos de primeira resposta, resolução e espera agora mostram o tempo em que 95% das conversas foram atendidas. Passe o mouse sobre o número para ver o tempo típico.
- tag: v4.15.1-auris.1.64
  published_at: '2026-09-29T22:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.64
  notes:
    en: |-
      ### ✨ What's new

      - **Automations move conversations in the funnel.** A rule can now move the conversation to a funnel stage — for example, to "Agendado" when the team sends the booking confirmation.
      - **Several ad accounts per clinic.** Add each Meta ad account one by one; AurisChat checks access right away and shows, per account, when spend was last synced or what went wrong.
      - **See the conversations behind the Analytics numbers.** Click Leads, Qualifying, Scheduling, Confirmed or Attendance on an ad to list its conversations.
      - **Website form leads keep their ad.** Leads that arrive through the website form are credited to the ad that brought them, show up in the ad reports and are sent back to Meta as they move through the funnel.

      ### ⚡ Improvements

      - **New AI status icon.** The "ia" tag on conversations is now a round sparkle icon: green when the AI is answering, grey when it's off. Click it to turn the AI on or off, as before.
      - **Funnel shows your conversations.** Agents now see in the funnel only the conversations of the inboxes they work in.

      ### 🐛 Fixes

      - **Moving cards on the funnel board.** Drag a card and release it anywhere over another lane — it moves right away, even onto an empty lane.
    pt_BR: |-
      ### ✨ Novidades

      - **Automações movem conversas no funil.** Uma regra agora pode mover a conversa para uma etapa do funil — por exemplo, para "Agendado" quando a equipe envia a confirmação do agendamento.
      - **Várias contas de anúncios por clínica.** Adicione cada conta de anúncios da Meta uma a uma; o AurisChat confere o acesso na hora e mostra, por conta, quando o gasto foi sincronizado ou o que deu errado.
      - **Veja as conversas por trás dos números do Analytics.** Clique em Leads, Em qualificação, Agendamento, Confirmado ou Comparecimentos de um anúncio para listar as conversas.
      - **Leads de formulário mantêm o anúncio de origem.** Quem chega pelo formulário do site é creditado ao anúncio que o trouxe, aparece nos relatórios de anúncios e é enviado de volta à Meta quando avança no funil.

      ### ⚡ Melhorias

      - **Novo ícone de status da IA.** A etiqueta "ia" das conversas virou um ícone redondo de estrelas: verde quando a IA está respondendo, cinza quando está desligada. Clique nele para ligar ou desligar a IA, como antes.
      - **Funil mostra as suas conversas.** Agentes passam a ver no funil só as conversas das caixas em que atendem.

      ### 🐛 Correções

      - **Mover cards no quadro do funil.** Arraste o card e solte em qualquer ponto de outra raia — ele move na hora, inclusive para uma raia vazia.
- tag: v4.15.1-auris.1.63
  published_at: '2026-09-28T23:30:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.63
  notes:
    en: |-
      ### ✨ What's new

      - **See the patients behind the funnel numbers.** In the funnel conversion report, click the number of scheduled, confirmed or attended patients (or the losses) to see who they are, with a link to each conversation.
    pt_BR: |-
      ### ✨ Novidades

      - **Veja os pacientes por trás dos números do funil.** No relatório de conversão do funil, clique no número de agendados, confirmados ou comparecimentos (ou nas perdas) para ver quem são, com link para cada conversa.
- tag: v4.15.1-auris.1.62
  published_at: '2026-09-25T21:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.62
  notes:
    en: |-
      ### ✨ What's new

      - **WhatsApp official-account templates when scheduling.** If your inbox is an official WhatsApp account, the scheduling modal now lets you pick from your approved templates — no more errors on the delivery date.
      - **Variables like contact name when scheduling.** Type `{{` in the Message field to insert the contact's name, email, phone. Same picker the conversation composer already has.

      ### ⚡ Improvements

      - **Scheduling modal in one line.** "Para" and "Via" at the top of the modal turned into compact chips — same feel as the "new conversation" pencil.
      - **Message field grows with your text.** The Message box in the scheduling modal grows as you type — no more scrolling inside a small box.
      - **"Retida" instead of "Suspensa".** The tab in the scheduled-messages panel was renamed to match the modal copy ("ficará retida para revisão").
      - **Scheduling modal doesn't close by accident.** Clicking outside the box no longer closes the modal — only Cancelar / Agendar (or the X) close it.
      - **Notifications with formatted titles and media.** Notifications from the team now show titles properly formatted and have room for images and videos in the body.

      ### 🐛 Fixes

      - **Steps bar on the proposal link.** The "1.Reservar → 6.Implantado" bar customers see when opening the proposal on their phone no longer breaks into two lines.
    pt_BR: |-
      ### ✨ Novidades

      - **Templates do WhatsApp oficial nas mensagens agendadas.** Se sua caixa é WhatsApp oficial, o modal de agendar agora deixa você escolher um dos templates aprovados — sem erro no dia do disparo.
      - **Variáveis como nome do contato ao agendar.** Digite `{{` no campo Mensagem para inserir nome do contato, e-mail, telefone. Mesmo seletor que o composer da conversa já tinha.

      ### ⚡ Melhorias

      - **Modal de agendar em uma linha.** "Para" e "Via" no topo do modal viraram chips compactos — mesma cara do lápis de nova conversa.
      - **Campo Mensagem cresce com o texto.** A caixa Mensagem do modal de agendar cresce enquanto você digita — sem rolar dentro de uma caixinha pequena.
      - **"Retida" no lugar de "Suspensa".** A aba do painel de mensagens agendadas foi renomeada pra bater com o texto do modal ("ficará retida para revisão").
      - **Modal de agendar não fecha mais por acidente.** Clicar fora da caixa não fecha mais o modal — só Cancelar / Agendar (ou o X) fecham.
      - **Notificações com títulos formatados e mídia.** As notificações que vocês recebem do time agora mostram títulos com formatação e têm espaço para imagens e vídeos no corpo.

      ### 🐛 Correções

      - **Barra de passos no link da proposta.** A barra "1.Reservar → 6.Implantado" que o cliente vê ao abrir a proposta no celular deixou de quebrar em duas linhas.
- tag: v4.15.1-auris.1.61
  published_at: '2026-09-24T21:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.61
  notes:
    en: |-
      ### ✨ What's new

      - **Scheduled messages panel.** A new *Agendadas* entry under *Conversas* on the left menu shows every scheduled message in one place, grouped by day (Hoje / Amanhã / Próximos 7 dias / Mais adiante) with tabs for Pendente, Enviada, Suspensa and Falhou. Click a row to jump to the conversation.
      - **Cancel a pending scheduled message.** On the panel, each *Pendente* row now has a trash button that cancels the schedule with one click.
      - **Schedule from the panel.** Click *+ Agendar mensagem* to schedule for any contact without opening the conversation first — you pick the contact and the inbox right there.
      - **Shortcut from the conversation to the panel.** The *Mensagens agendadas* section on the conversation sidebar now has a small external-link icon that opens the full panel in a new tab.

      ### ⚡ Improvements

      - **"Não atendidas" icon.** Was almost identical to *Agendadas* (both clocks). It is now a distinct message-with-warning icon so the two read separately at a glance.
    pt_BR: |-
      ### ✨ Novidades

      - **Painel de mensagens agendadas.** No menu lateral, sob *Conversas*, um novo item *Agendadas* mostra todas as mensagens agendadas em um só lugar, agrupadas por dia (Hoje / Amanhã / Próximos 7 dias / Mais adiante), com abas Pendente, Enviada, Suspensa e Falhou. Clicar na linha abre a conversa.
      - **Cancelar mensagem agendada pendente.** No painel, cada linha em *Pendente* agora tem um botão de lixeira que cancela o agendamento em um clique.
      - **Agendar mensagem direto do painel.** Clique em *+ Agendar mensagem* para agendar para qualquer contato sem precisar abrir a conversa — você escolhe o contato e a caixa ali mesmo.
      - **Atalho da conversa para o painel.** A seção *Mensagens agendadas* na barra lateral da conversa ganhou um ícone de link externo que abre o painel completo em uma nova aba.

      ### ⚡ Melhorias

      - **Ícone de "Não atendidas".** Antes era quase igual ao de *Agendadas* (dois relógios); agora é um balão com aviso, para os dois ficarem distinguíveis num olhar.
- tag: v4.15.1-auris.1.60
  published_at: '2026-09-23T21:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.60
  notes:
    en: |-
      ### 🐛 Fixes

      - **Funil opens on busy accounts.** The Funil screen was showing an error on accounts with a lot of leads. Every column now brings the 25 most recent leads and offers a *Carregar mais* button at the bottom to page through the rest.

      ### ✨ What's new

      - **Mídia split by type.** The Mídia screen now has five tabs — Imagens, Vídeos, Áudios, Documentos and Links — so you jump straight to what you're looking for.
      - **Real thumbnails on Mídia.** Audio rows show a sound-wave icon; video rows try to show the first frame from the file itself, with a play icon as a fallback when the browser can't preview it.
      - **Mídia scrolls to older items.** Reaching the end of the list now brings more items automatically — before, only the first batch was loaded.
    pt_BR: |-
      ### 🐛 Correções

      - **Funil abre em contas com muitos leads.** A tela do Funil estava dando erro em contas com muitos leads. Cada coluna agora traz os 25 leads mais recentes com um botão *Carregar mais* no rodapé para trazer os próximos aos poucos.

      ### ✨ Novidades

      - **Mídia separada por tipo.** A tela Mídia agora tem cinco abas — Imagens, Vídeos, Áudios, Documentos e Links — para você ir direto no que procura.
      - **Miniaturas de verdade na Mídia.** Áudios ganharam ícone de onda sonora; vídeos tentam mostrar o primeiro frame do arquivo, com um ícone de play como alternativa quando o navegador não consegue.
      - **Mídia rola para itens mais antigos.** Ao chegar no fim da lista, mais mídias aparecem automaticamente — antes só a primeira leva era carregada.
- tag: v4.15.1-auris.1.59
  published_at: '2026-09-22T21:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.59
  notes:
    en: |-
      ### ✨ What's new

      - **Media Hub in the sidebar.** A new *Mídia* menu shows everything shared across every conversation, split in *Mídias*, *Documentos* and *Links*. Preview on click, forward, reply, star or delete from a per-item menu — and pick many at once to act on the whole selection.
      - **WhatsApp window chip on the conversation.** A small chip on top of the conversation shows how much time is left in the 24h or 72h window ("Janela 24h", "Janela 72h - Anúncio", "Janela fechando…", "Janela fechada"). The "?" opens a short hint on what you can still send in that state.
      - **Cleaner conversation header.** The *Resolver* button, the three-dot menu and the contact-panel toggle are now discrete icons, taking less space and leaving each action one click away.
      - **Payment links right on the reservation row.** Expanding a reservation now shows the AsaaS / Stripe / Inter link generated for that sale (when there is one), with a copy icon in Auris blue.
      - **Automation reacts when the funnel stage changes.** A new *Funil atualizado* event lets an automation run when a conversation moves between stages.
      - **Auto-assign of the team can include offline agents.** Each team can now choose to fall back to the whole team (including offline) so no conversation stays unassigned after hours.
    pt_BR: |-
      ### ✨ Novidades

      - **Media Hub no menu lateral.** Um novo menu *Mídia* mostra tudo o que foi compartilhado em todas as conversas, separado em *Mídias*, *Documentos* e *Links*. Você pode ver o preview, encaminhar, responder, favoritar ou apagar direto pelo menu de cada item — e selecionar vários de uma vez para agir na seleção toda.
      - **Chip da janela do WhatsApp na conversa.** Um chip pequeno no topo da conversa mostra quanto tempo ainda falta na janela de 24h ou 72h ("Janela 24h", "Janela 72h - Anúncio", "Janela fechando…", "Janela fechada"). O "?" abre uma dica curta do que ainda dá pra enviar naquele estado.
      - **Cabeçalho da conversa mais limpo.** O botão *Resolver*, o menu de três pontinhos e o botão do painel de contato viraram ícones discretos, ocupando menos espaço e deixando cada ação a um clique de distância.
      - **Links de pagamento direto na linha da reserva.** Ao expandir uma reserva aparecem os links do AsaaS / Stripe / Inter gerados para aquela venda (quando existem), com um ícone azul Auris pra copiar.
      - **Automação reage quando a etapa do funil muda.** Um novo evento *Funil atualizado* permite disparar uma automação quando a conversa muda de etapa.
      - **Auto-atribuição do time pode incluir agentes offline.** Cada time agora pode optar por considerar o time inteiro (incluindo offline), pra nenhuma conversa ficar sem responsável fora do expediente.
- tag: v4.15.1-auris.1.58
  published_at: '2026-09-18T17:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.58
  notes:
    en: |-
      ### ⚡ Improvements

      - **Sidebar starts collapsed.** New accounts open with the menu tucked to the left, giving the conversation area more room. Pin it open if you prefer.
      - **Meta template name checked as you type.** When you create a WhatsApp Meta template, the page tells you right away if the name breaks the format Meta requires — no more surprises on save.
      - **Meta template body grows with the message.** The body field now expands as the message grows — long templates stop scrolling inside a small box while you're editing.
    pt_BR: |-
      ### ⚡ Melhorias

      - **Menu lateral inicia recolhido.** Contas novas abrem com o menu encolhido à esquerda, sobrando mais espaço para as conversas. Se preferir, você pode fixar aberto.
      - **Nome do template Meta conferido ao digitar.** Ao criar um template Meta pro WhatsApp, a página avisa na hora se o nome não segue o formato exigido pela Meta — sem sustos na hora de salvar.
      - **Texto do corpo do template Meta cresce com a mensagem.** O campo aumenta conforme a mensagem fica maior — template longo deixa de rolar dentro de uma caixinha pequena enquanto você edita.
- tag: v4.15.1-auris.1.57
  published_at: '2026-09-15T18:30:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.57
  notes:
    en: |-
      ### ✨ What's new

      - **Filter conversations of a specific day with one click.** The "Criado em" and "Última atividade em" filters gained an "É igual a" operator that returns the conversations from the day you pick — a single filter instead of combining "greater than yesterday" and "less than tomorrow".

      ### 🐛 Fixes

      - **Date filter on the conversation list returns the right rows again.** Filtering by "Criado em maior que X" and "Criado em menor que Y" could return an empty list even when the top counter showed several matches. The list now matches the counter.
      - **Signing new terms of use after the deadline.** If the deadline for signing a new terms of use passed and the manager only got to it after that, the signature window would not open — the account stayed blocked with no way to unlock it. The window now opens for the manager whenever the terms are still waiting to be signed.
    pt_BR: |-
      ### ✨ Novidades

      - **Filtrar conversas de um dia específico com um clique.** Os filtros "Criado em" e "Última atividade em" ganharam o operador "É igual a", que traz as conversas do dia escolhido — um filtro só, em vez de combinar "maior que ontem" e "menor que amanhã".

      ### 🐛 Correções

      - **Filtro por data na lista de conversas volta a trazer as certas.** Filtrar por "Criado em maior que X" e "Criado em menor que Y" podia devolver a lista vazia mesmo com o contador do topo mostrando várias conversas. A lista volta a bater com o contador.
      - **Assinar novos termos de uso depois do prazo.** Se o prazo para assinar novos termos de uso passasse e a gerente só entrasse depois, a janela de assinatura não abria — a conta ficava bloqueada sem como destravar. A janela agora abre para a gerente sempre que os termos ainda estão aguardando assinatura.
- tag: v4.15.1-auris.1.56
  published_at: '2026-09-11T22:30:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.56
  notes:
    en: |-
      ### ⚡ Improvements

      - **Fewer labels on the picker.** The internal "agente-off" label no longer clutters the label picker or the sidebar. Existing tags on old conversations stay where they are.

      ### 🐛 Fixes

      - **Filtering conversations by funnel stage.** Picking a stage on the conversation filter (or opening a saved folder built on it) now returns the conversations you see on the funnel board — the list was coming empty by mistake.
      - **Downloading the PDF transcript.** Some conversations failed to generate the PDF with a generic "could not generate transcript" error. Those cases now download normally.
    pt_BR: |-
      ### ⚡ Melhorias

      - **Menos etiquetas no seletor.** A etiqueta interna "agente-off" não aparece mais no seletor de etiquetas nem na barra lateral. As marcações antigas em conversas continuam onde estão.

      ### 🐛 Correções

      - **Filtro de conversas por etapa do funil.** Escolher uma etapa no filtro de conversas (ou abrir uma pasta salva com esse filtro) volta a trazer as conversas que aparecem no quadro do funil — a lista estava vindo vazia por engano.
      - **Baixar o PDF da transcrição.** Algumas conversas específicas falhavam ao gerar o PDF com um aviso genérico de "não foi possível gerar o PDF da transcrição". Esses casos agora baixam normal.
- tag: v4.15.1-auris.1.55
  published_at: '2026-09-09T19:15:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.55
  notes:
    en: |-
      ### 🐛 Fixes

      - **Buttons at the top of the conversation stop getting cut off on narrow panels.** With the side menu and the contact panel both open, the buttons at the top of a conversation (Resolver, funnel stage, AI badge) were being clipped. They now wrap to a second row when there is no horizontal room.
    pt_BR: |-
      ### 🐛 Correções

      - **Botões do topo da conversa deixam de ficar cortados em painéis estreitos.** Com o menu lateral e o painel do contato abertos ao mesmo tempo, os botões do topo de uma conversa (Resolver, etapa do funil, indicador da IA) ficavam cortados. Agora eles quebram para uma segunda linha quando não há espaço horizontal.
- tag: v4.15.1-auris.1.54
  published_at: '2026-09-06T03:30:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.54
  notes:
    en: |-
      ### ✨ What's new

      - **New terms of use — the manager needs to accept.** When the AurisChat team publishes an updated terms of use, the manager of the clinic sees a screen with the new text on the next login. They have to scroll to the end and confirm acceptance — same idea as the acceptance on a new contract.
      - **Deadline on the acceptance.** Each request carries a deadline (usually a few days). If the manager does not accept in time, the AurisChat panel pauses for everyone in the clinic until the manager comes in and confirms. Before the deadline, the team sees a notice with the date so nobody is surprised.
    pt_BR: |-
      ### ✨ Novidades

      - **Novos termos de uso — a gerente precisa aceitar.** Quando a equipe Auris publica uma versão atualizada dos termos de uso, a gerente da clínica vê uma tela com o novo texto no próximo login. Ela precisa rolar até o fim e confirmar o aceite — mesma ideia do aceite de um novo contrato.
      - **Prazo para o aceite.** Cada pedido tem uma data de vencimento (normalmente alguns dias). Se a gerente não aceitar dentro do prazo, o painel do AurisChat fica pausado para todos da clínica até ela entrar e confirmar. Antes do prazo, a equipe vê um aviso com a data para ninguém ser pego de surpresa.
