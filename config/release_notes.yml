- tag: v4.15.1-auris.1.51
  published_at: '2026-08-28T21:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.51
  notes:
    en: |-
      ### 🐛 Fixes

