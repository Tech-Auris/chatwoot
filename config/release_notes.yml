- tag: v4.15.1-auris.1.48
  published_at: '2026-08-19T19:30:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.48
  notes:
    en: |-
      ### ✨ What's new

      - **Notifications for mentions and direct messages in the internal chat.** When a colleague mentions you or sends you a direct message, you get a notification like any other — and you can turn each one off in your profile.

      ### 🐛 Fixes

      - **The connection light of an inbox tells the truth.** It could stay green after WhatsApp had disconnected, even after reloading the page, so nobody noticed the inbox had gone quiet.
      - **An inbox stuck out of WhatsApp recovers.** When the connection cannot be re-established, reconnecting now discards the dead session instead of retrying it forever, and the message on screen says what actually solves it.
      - **The campaign audience file says which row was left out and why.** It used to report only how many rows were skipped, with no way to know what to fix in the spreadsheet.
    pt_BR: |-
      ### ✨ Novidades

      - **Notificação de menção e mensagem direta no chat interno.** Quando alguém te menciona ou te manda uma mensagem direta, você recebe uma notificação como qualquer outra — e pode desligar cada uma delas no seu perfil.

      ### 🐛 Correções

      - **A luz de conexão da caixa de entrada mostra a verdade.** Ela podia continuar verde depois que o WhatsApp tinha caído, mesmo recarregando a página, e ninguém percebia que a caixa estava parada.
      - **Caixa que sai do WhatsApp e não volta agora se recupera.** Quando a conexão não consegue ser restabelecida, reconectar passa a descartar a sessão morta em vez de insistir nela, e a mensagem da tela diz o que realmente resolve.
      - **O arquivo de público da campanha diz qual linha ficou de fora e por quê.** Antes aparecia só a quantidade de linhas ignoradas, sem indicar o que corrigir na planilha.
- tag: v4.15.1-auris.1.47
  published_at: '2026-08-19T02:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.47
  notes:
    en: |-
      ### ⚡ Improvements

      - **The campaign report opens with the campaign on top.** Template, inbox, schedule, audience and cadence are right there, so you can tell which campaign you are looking at without going back.

      ### 🐛 Fixes

      - **The report shows when each message actually went out.** It used to show the moment the message was prepared, which is the same instant for the whole campaign — a campaign spaced by one minute looked like everything left at once.
      - **Contacts from a spreadsheet keep the name you gave them.** When the phone number already existed in the system with no name, or with the number itself as the name, the name from the file is now applied instead of being dropped.
    pt_BR: |-
      ### ⚡ Melhorias

      - **O relatório da campanha abre com a campanha no topo.** Modelo, caixa de entrada, agendamento, público e cadência ficam à vista, então dá para saber de qual campanha é o relatório sem voltar.

      ### 🐛 Correções

      - **O relatório mostra quando cada mensagem realmente saiu.** Antes mostrava o momento em que a mensagem foi preparada, que é o mesmo para a campanha inteira — uma campanha espaçada de 1 minuto parecia ter saído tudo junto.
      - **Contatos vindos de planilha ficam com o nome que você informou.** Quando o telefone já existia no sistema sem nome, ou com o próprio número no lugar do nome, o nome do arquivo passa a ser aplicado em vez de descartado.
- tag: v4.15.1-auris.1.46
  published_at: '2026-08-18T22:00:00Z'
  url: https://github.com/Tech-Auris/chatwoot/releases/tag/v4.15.1-auris.1.46
  notes:
    en: |-
      ### ✨ What's new

      - **Quick replies can now belong to a single inbox.** When creating one you choose whether it shows up everywhere or only in one inbox. Typing "/" in a conversation offers the general ones plus that inbox's, so the list stops filling up with replies meant for another channel.
      - **WhatsApp campaigns send at your pace.** You choose the interval between one message and the next, from 10 seconds up to 5 minutes, instead of everything leaving at once. Replies you are typing no longer wait in line behind a campaign.
      - **Campaign audience from a spreadsheet.** Besides picking customer labels, you can upload a CSV with the contacts. New ones are created and the ones already in the system are matched by phone number. There is a sample file to download.
      - **Check who will receive the campaign.** A "Ver público" button lists everyone before you schedule it, and points out who has no phone number and therefore won't receive it.
      - **Campaign report.** Each campaign now has a report with the totals — sent, delivered, read and failed — and one line per contact, with the reason when something failed and a link that opens the conversation.
      - **Tag the campaign conversations.** You can choose a label to be applied to every conversation the campaign touches, making them easy to find afterwards.
    pt_BR: |-
      ### ✨ Novidades

      - **Respostas prontas agora podem ser de uma caixa de entrada só.** Ao criar, você escolhe se ela aparece em todas ou apenas em uma caixa. Digitando "/" na conversa aparecem as gerais mais as daquela caixa, então a lista para de encher com respostas de outro canal.
      - **Campanhas de WhatsApp enviam no seu ritmo.** Você escolhe o intervalo entre uma mensagem e a próxima, de 10 segundos até 5 minutos, em vez de sair tudo de uma vez. As respostas que você está digitando deixam de ficar na fila atrás da campanha.
      - **Público da campanha por planilha.** Além de escolher etiquetas dos clientes, dá para enviar um CSV com os contatos. Os novos são criados e os que já existem são reconhecidos pelo telefone. Tem um arquivo de exemplo para baixar.
      - **Conferir quem vai receber a campanha.** O botão "Ver público" lista todo mundo antes de agendar, e avisa quem está sem telefone e por isso não vai receber.
      - **Relatório da campanha.** Cada campanha passa a ter um relatório com os totais — enviadas, entregues, lidas e falhas — e uma linha por contato, com o motivo quando algo falhou e um link que abre a conversa.
      - **Etiquetar as conversas da campanha.** Você pode escolher uma etiqueta para ser aplicada em todas as conversas que a campanha tocar, o que facilita encontrá-las depois.
