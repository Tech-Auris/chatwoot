    description: Produção
paths:
  $ref: ./paths/index.yml
components:
  schemas:
    $ref: ./definitions/index.yml
  parameters:
    $ref: ./parameters/index.yml
  securitySchemes:
    userApiKey:
      type: apiKey
      in: header
      name: api_access_token
      description: Token de acesso pessoal do usuário, copiado em Configurações do Perfil → Token de acesso. Envie no cabeçalho `api_access_token`. A API responde com as mesmas permissões que o usuário tem no painel (agente, gerente ou administrador). Veja a seção "Autenticação" no início desta documentação.
    agentBotApiKey:
      type: apiKey
      in: header
      name: api_access_token
      description: This token should be provided by system admin or obtained via rails console. This token can be used to build bot integrations and can only access limited apis.
    platformAppApiKey:
      type: apiKey
      in: header
      name: api_access_token
      description: This token can be obtained by the system admin after creating a platformApp. This token should be used to provision agent bots, accounts, users and their roles.
