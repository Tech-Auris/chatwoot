type: object
properties:
  usage:
    type: array
    description: Consumption of the period, one entry per account.
    items:
      type: object
      properties:
        account_id:
          type: integer
          description: AurisChat account id. The account must be linked to a Stripe customer.
        text:
          type: integer
          description: Text messages billed in the period.
        media:
          type: integer
          description: Answers to images, files and audio transcriptions billed in the period.
        audio:
          type: integer
          description: Audio messages billed in the period.
      required:
        - account_id
  prices:
    type: object
    description: >-
      Stripe price id charged for each category. Optional — when omitted, the
      prices last chosen on Financeiro → Cobrança de tokens are used, so an
      automation does not carry a copy that goes stale when a price is
      readjusted.
    properties:
      text:
        type: string
      media:
        type: string
      audio:
        type: string
  description:
    type: string
    description: Text printed on the invoice, e.g. "Cobrança Tokens - Julho/2026".
  period:
    type: string
    description: Stamped on the invoice metadata so the batch can be recognized later, e.g. "2026-07".
  days_until_due:
    type: integer
    description: Days until the invoice is due. Defaults to 7.
required:
  - usage
