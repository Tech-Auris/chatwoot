#
# O "commits behind fazer-ai/chatwoot:main" do GitHub conta ancestralidade no git:
# um PR portado à mão (ou cherry-pick) nunca sai dessa conta. Esta lista é a fonte
# de verdade. Rode `bin/fazer-ai-pending` para ver o que ainda falta decidir.
#
# status:
#   trazido     coberto pelo nosso PR auris_pr (aberto ou já mergeado). parcial: true quando só parte veio.
#   trazer      decidido trazer, ainda não feito (story = id da estória no ClickUp).
#   nao_trazer  decidido não trazer. motivo é obrigatório.
# Qualquer PR, sync ou commit fora desta lista conta como "pendente" (sem decisão).
#
# Ao portar um PR: acrescente a linha aqui no mesmo PR do port.

